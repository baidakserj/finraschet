```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФинРасчёт — сложный процент</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top left, #243b80 0, transparent 35%),
        radial-gradient(circle at bottom right, #4b1f72 0, transparent 35%),
        #0b1020;
    min-height: 100vh;
}

.back-link {
    display: block;
    margin: 0 auto 20px;
    max-width: 1000px;
    padding: 0 5%;
    color: #4facfe;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: #8f7cff;
}

.container {
    width: min(900px, 94%);
    margin: auto;
    padding: 30px 0 40px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 40px;
    margin: 0;
}

.header h1 span {
    color: #4facfe;
}

.header p {
    color: #9ba7c0;
}

.card {
    background: rgba(20,28,52,.9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 24px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

label {
    display: block;
    margin: 16px 0 7px;
    color: #bac4da;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #34415f;
    background: #11182c;
    color: white;
    font-size: 17px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(90deg,#1677ff,#7b61ff);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.result {
    text-align: center;
    padding: 25px;
    border-radius: 20px;
    background: linear-gradient(135deg,#1677ff,#784cff);
}

.result small {
    color: #dce6ff;
}

.result strong {
    display: block;
    font-size: 38px;
    margin-top: 8px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.stat {
    background: #11182c;
    border: 1px solid #293654;
    border-radius: 15px;
    padding: 16px;
}

.stat small {
    display: block;
    color: #8996b2;
    margin-bottom: 7px;
}

.stat strong {
    font-size: 19px;
}

.profit {
    color: #36e0a2;
}

.chart {
    height: 250px;
    display: flex;
    align-items: flex-end;
    gap: 7px;
    border-bottom: 1px solid #33405d;
    padding-top: 20px;
    overflow-x: auto;
}

.bar {
    min-width: 20px;
    background: linear-gradient(to top,#1677ff,#8f7cff);
    border-radius: 6px 6px 0 0;

@media(max-width:600px) {

    .header h1 {
        font-size: 30px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<a href="index.html" class="back-link">← Все калькуляторы</a>

<div class="container">

    <div class="header">

        <h1>
            <span>ФинРасчёт</span> — сложный процент
        </h1>

        <p>
            Узнайте, как ваши деньги могут расти со временем
        </p>

    </div>

    <div class="card">

        <h2>Параметры расчёта</h2>

        <label>Начальная сумма, ₽</label>

        <input
            type="number"
            id="initial"
            value="100000"
        >

        <label>Доходность, % годовых</label>

        <input
            type="number"
            id="rate"
            value="10"
            step="0.1"
        >

        <label>Срок, лет</label>

        <input
            type="number"
            id="years"
            value="10"
            step="1"
        >

        <button onclick="calculate()">
            Рассчитать
        </button>

    </div>

    <div class="card">

        <div class="result">

            <small>Итоговая сумма</small>

            <strong id="finalAmount">—</strong>

        </div>

        <div class="stats">

            <div class="stat">

                <small>Начальная сумма</small>

                <strong id="startAmount">—</strong>

            </div>

            <div class="stat">

                <small>Доход</small>

                <strong class="profit" id="profit">—</strong>

            </div>

            <div class="stat">

                <small>Рост капитала</small>

                <strong class="profit" id="growth">—</strong>

            </div>

            <div class="stat">

                <small>Ставка</small>

                <strong id="rateResult">—</strong>

            </div>

        </div>

    </div>

    <div class="card">

        <h2>Рост капитала</h2>

        <div class="chart" id="chart"></div>

    </div>

</div>

<script>

function money(value) {

    return Math.round(value)
        .toLocaleString("ru-RU") + " ₽";

}

function calculate() {

    const initial =
        Number(document.getElementById("initial").value);

    const rate =
        Number(document.getElementById("rate").value);

    const years =
        Number(document.getElementById("years").value);

    if (
        initial <= 0 ||
        rate < 0 ||
        years <= 0
    ) {

        alert("Проверьте введённые значения.");

        return;

    }

    const annualRate =
        rate / 100;

    const finalAmount =
        initial *
        Math.pow(
            1 + annualRate,
            years
        );

    const profit =
        finalAmount - initial;

    const growth =
        (finalAmount / initial) * 100;

    document.getElementById("finalAmount").textContent =
        money(finalAmount);

    document.getElementById("startAmount").textContent =
        money(initial);

    document.getElementById("profit").textContent =
        money(profit);

    document.getElementById("growth").textContent =
        growth.toFixed(1).replace(".", ",") + "%";

    document.getElementById("rateResult").textContent =
        rate.toFixed(1).replace(".", ",") + "%";

    const chart =
        document.getElementById("chart");

    chart.innerHTML = "";

    let balances = [];

    for (
        let year = 1;
        year <= years;
        year++
    ) {

        const amount =
            initial *
            Math.pow(
                1 + annualRate,
                year
            );

        balances.push(amount);

    }

    const max =
        Math.max(...balances);

    balances.forEach(
        (amount, index) => {

            const bar =
                document.createElement("div");

            bar.className = "bar";

            bar.style.height =
                (amount / max * 220) + "px";

            bar.title =
                "Год " +
                (index + 1) +
                ": " +
                money(amount);

            chart.appendChild(bar);

        }
    );

}

calculate();

</script>

</body>
</html>
