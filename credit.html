
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ФинРасчёт — кредитный калькулятор</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;

    background:
        radial-gradient(circle at top left, #243b80 0, transparent 35%),
        radial-gradient(circle at bottom right, #4b1f72 0, transparent 35%),
        #0b1020;
}

.back-link {
    display: block;
    margin: 0 auto 20px;
    max-width: 1000px;
    padding: 0 5%;
    color: #4facfe;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: #8f7cff;
}

.container {
    width: min(1000px, 94%);
    margin: auto;
    padding: 35px 0 50px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0 0 15px;
    font-size: 42px;
}

.header h1 span {
    background: linear-gradient(90deg, #4facfe, #8f7cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.card {
    background: rgba(20,28,52,.9);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

label {
    display: block;
    margin-bottom: 8px;
    color: #aab5ca;
}

input,
select {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: #10172a;
    color: white;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #1677ff, #7b61ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.12);
}

.result {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.result-box {
    background: #10172a;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    color: #aab5ca;
}

.result-box strong {
    display: block;
    color: white;
    font-size: 24px;
    margin-top: 8px;
}

.savings {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.saving-box {
    background: #10172a;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.saving-box span {
    color: #aab5ca;
}

.saving-box strong {
    display: block;
    font-size: 24px;
    margin-top: 8px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    color: #9ba7c0;
    font-weight: normal;
}

th,
td {
    padding: 11px 8px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

td {
    text-align: right;
}

th:first-child,
td:first-child {
    text-align: left;
}

h2 {
    margin-top: 0;
}

.hidden {
    display: none;
}

@media (max-width: 700px) {

    .result,
    .savings {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 32px;
    }

    .card {
        padding: 20px;
    }
}

</style>
</head>

<body>

<a href="index.html" class="back-link">
    ← Все калькуляторы
</a>

<div class="container">

    <div class="header">

        <h1>
            <span>Кредитный калькулятор</span>
        </h1>

    </div>


    <!-- ОСНОВНОЙ КРЕДИТ -->

    <div class="card">

        <label>Сумма кредита, ₽</label>

        <input
            type="number"
            id="amount"
            value="1000000"
            min="1"
        >


        <label>Процентная ставка, % годовых</label>

        <input
            type="number"
            id="rate"
            value="20"
            step="0.1"
            min="0"
        >


        <label>Срок кредита, месяцев</label>

        <input
            type="number"
            id="months"
            value="60"
            min="1"
        >


        <button onclick="calculate()">
            Рассчитать
        </button>

    </div>


    <!-- РЕЗУЛЬТАТ -->

    <div class="card">

        <div class="result">

            <div class="result-box">
                Ежемесячный платёж
                <strong id="payment">—</strong>
            </div>

            <div class="result-box">
                Всего выплатите
                <strong id="total">—</strong>
            </div>

            <div class="result-box">
                Переплата
                <strong id="overpay">—</strong>
            </div>

        </div>

    </div>


    <!-- ДОСРОЧНОЕ ПОГАШЕНИЕ -->

    <div class="card">

        <h2>Досрочное погашение</h2>

        <label>
            Через сколько месяцев сделать досрочный платёж
        </label>

        <input
            type="number"
            id="earlyMonth"
            value="12"
            min="1"
        >


        <label>
            Сумма досрочного платежа, ₽
        </label>

        <input
            type="number"
            id="earlyAmount"
            value="200000"
            min="0"
        >


        <label>
            Что сделать после досрочного платежа?
        </label>

        <select id="earlyType">

            <option value="payment">
                Уменьшить ежемесячный платёж
            </option>

            <option value="term">
                Сократить срок кредита
            </option>

        </select>


        <button onclick="calculateEarly()">
            Рассчитать досрочное погашение
        </button>

    </div>


    <!-- ЭКОНОМИЯ -->

    <div class="card hidden" id="earlyResult">

        <h2>Результат досрочного погашения</h2>

        <div class="savings">

            <div class="saving-box">

                <span>Экономия на процентах</span>

                <strong id="interestSaving">—</strong>

            </div>


            <div class="saving-box">

                <span>Новая переплата</span>

                <strong id="newOverpay">—</strong>

            </div>


            <div class="saving-box">

                <span>Сэкономлено времени</span>

                <strong id="timeSaving">—</strong>

            </div>

        </div>

    </div>


    <!-- ГРАФИК -->

    <div class="card">

        <h2>
            График платежей
        </h2>

        <div class="table-wrap">

            <div id="schedule"></div>

        </div>

    </div>


</div>


<script>

function formatMoney(number) {

    return Math.round(number)
        .toLocaleString('ru-RU') + ' ₽';

}


function calculatePayment(balance, monthlyRate, months) {

    if (months <= 0) {
        return 0;
    }

    if (monthlyRate === 0) {
        return balance / months;
    }

    return balance *
        monthlyRate *
        Math.pow(1 + monthlyRate, months) /
        (Math.pow(1 + monthlyRate, months) - 1);

}


function buildSchedule(amount, annualRate, months) {

    const monthlyRate =
        annualRate / 100 / 12;

    const payment =
        calculatePayment(
            amount,
            monthlyRate,
            months
        );

    let balance = amount;

    let interestTotal = 0;

    let rows = [];


    for (
        let month = 1;
        month <= months;
        month++
    ) {

        const interest =
            balance * monthlyRate;

        let principal =
            payment - interest;


        if (principal > balance) {
            principal = balance;
        }


        balance -= principal;


        if (balance < 0.01) {
            balance = 0;
        }


        interestTotal += interest;


        rows.push({

            month: month,

            payment: payment,

            interest: interest,

            principal: principal,

            balance: balance

        });


        if (balance === 0) {
            break;
        }

    }


    return {

        payment: payment,

        interestTotal: interestTotal,

        total: amount + interestTotal,

        rows: rows

    };

}


function calculate() {

    const amount =
        Number(document.getElementById('amount').value);

    const annualRate =
        Number(document.getElementById('rate').value);

    const months =
        Number(document.getElementById('months').value);


    if (
        amount <= 0 ||
        months <= 0 ||
        annualRate < 0
    ) {
        alert('Проверьте введённые данные.');

        return;
    }


    const result =
        buildSchedule(
            amount,
            annualRate,
            months
        );


    document.getElementById('payment').textContent =
        formatMoney(result.payment);


    document.getElementById('total').textContent =
        formatMoney(result.total);


    document.getElementById('overpay').textContent =
        formatMoney(result.interestTotal);


    let html = `

        <table>

            <tr>

                <th>Месяц</th>

                <th>Платёж</th>

                <th>Проценты</th>

                <th>Тело кредита</th>

                <th>Остаток</th>

            </tr>

    `;


    result.rows.forEach(row => {

        html += `

            <tr>

                <td>${row.month}</td>

                <td>${formatMoney(row.payment)}</td>

                <td>${formatMoney(row.interest)}</td>

                <td>${formatMoney(row.principal)}</td>

                <td>${formatMoney(row.balance)}</td>

            </tr>

        `;

    });


    html += `</table>`;


    document.getElementById('schedule').innerHTML =
        html;

}


function calculateEarly() {

    const amount =
        Number(document.getElementById('amount').value);

    const annualRate =
        Number(document.getElementById('rate').value);

    const months =
        Number(document.getElementById('months').value);

    const earlyMonth =
        Number(document.getElementById('earlyMonth').value);

    const earlyAmount =
        Number(document.getElementById('earlyAmount').value);

    const earlyType =
        document.getElementById('earlyType').value;


    if (
        amount <= 0 ||
        months <= 0 ||
        annualRate < 0 ||
        earlyMonth < 1 ||
        earlyMonth >= months ||
        earlyAmount <= 0
    ) {

        alert('Проверьте данные для досрочного погашения.');

        return;
    }


    const original =
        buildSchedule(
            amount,
            annualRate,
            months
        );


    const monthlyRate =
        annualRate / 100 / 12;


    const balanceBefore =
        original.rows[earlyMonth - 1].balance;


    const remaining =
        Math.max(
            0,
            balanceBefore - earlyAmount
        );


    if (remaining === 0) {

        const saving =
            original.interestTotal;

        document.getElementById('interestSaving').textContent =
            formatMoney(saving);

        document.getElementById('newOverpay').textContent =
            '0 ₽';

        document.getElementById('timeSaving').textContent =
            (months - earlyMonth) + ' мес.';

        document.getElementById('earlyResult')
            .classList.remove('hidden');

        return;
    }


    let newMonths;

    let newPayment;


    if (earlyType === 'payment') {

        newMonths =
            months - earlyMonth;

        newPayment =
            calculatePayment(
                remaining,
                monthlyRate,
                newMonths
            );

    } else {

        newPayment =
            original.payment;

        newMonths = 0;

        let newBalance =
            remaining;


        while (
            newBalance > 0.01 &&
            newMonths < months
        ) {

            const interest =
                newBalance * monthlyRate;

            let principal =
                newPayment - interest;


            if (principal <= 0) {
                break;
            }


            if (principal > newBalance) {
                principal = newBalance;
            }


            newBalance -= principal;

            newMonths++;

        }

    }


    const interestBefore =
        original.interestTotal;


    let interestAfter =
        0;


    if (earlyType === 'payment') {

        interestAfter =
            newPayment * newMonths - remaining;

    } else {

        interestAfter =
            newPayment * newMonths - remaining;

    }


    const newOverpay =
        interestAfter +
        (amount - balanceBefore);


    const interestSaving =
        Math.max(
            0,
            interestBefore - newOverpay
        );


    const timeSaving =
        Math.max(
            0,
            months - (earlyMonth + newMonths)
        );


    document.getElementById('interestSaving').textContent =
        formatMoney(interestSaving);


    document.getElementById('newOverpay').textContent =
        formatMoney(newOverpay);


    document.getElementById('timeSaving').textContent =
        timeSaving + ' мес.';


    document.getElementById('earlyResult')
        .classList.remove('hidden');

}


calculate();

</script>

</body>
</html>
