<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФинРасчёт — кредитный калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: #fff;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.card {
    background: #191e28;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #bbb;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 1px solid #343b48;
    background: #10131a;
    color: #fff;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #4caf50;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.result {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.result-box {
    background: #10131a;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.result-box strong {
    display: block;
    font-size: 24px;
    margin-top: 8px;
}

@media (max-width: 650px) {
    .result {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Кредитный калькулятор</h1>
    <a href="index.html" style="
    display: block;
    text-align: center;
    margin-bottom: 25px;
    color: #bbb;
    text-decoration: none;
">
    ← Все калькуляторы
</a>

    <div class="card">

        <label>Сумма кредита, ₽</label>
        <input type="number" id="amount" value="1000000">

        <label>Процентная ставка, % годовых</label>
        <input type="number" id="rate" value="20" step="0.1">

        <label>Срок, месяцев</label>
        <input type="number" id="months" value="60">

        <button onclick="calculate()">Рассчитать</button>

    </div>

    <div class="card">

        <div class="result">

            <div class="result-box">
                Ежемесячный платёж
                <strong id="payment">—</strong>
            </div>

            <div class="result-box">
                Всего выплатите
                <strong id="total">—</strong>
            </div>

            <div class="result-box">
                Переплата
                <strong id="overpay">—</strong>
            </div>

        </div>

    </div>

</div>

      <div class="card">

        <h2>График платежей</h2>

        <div id="schedule"></div>

    </div>  
<script>

function formatMoney(number) {
    return Math.round(number).toLocaleString('ru-RU') + ' ₽';
}

function calculate() {

    const amount = Number(document.getElementById('amount').value);
    const annualRate = Number(document.getElementById('rate').value);
    const months = Number(document.getElementById('months').value);

    const monthlyRate = annualRate / 100 / 12;

    let payment;

    if (monthlyRate === 0) {
        payment = amount / months;
    } else {
        payment =
            amount *
            monthlyRate *
            Math.pow(1 + monthlyRate, months) /
            (Math.pow(1 + monthlyRate, months) - 1);
    }

    const total = payment * months;
    const overpay = total - amount;

    document.getElementById('payment').textContent = formatMoney(payment);
    document.getElementById('total').textContent = formatMoney(total);
    document.getElementById('overpay').textContent = formatMoney(overpay);
}

calculate();

</script>

</body>
</html>
