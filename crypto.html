<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФинРасчёт — конвертер криптовалют</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

.back {
    display: inline-block;
    color: #60a5fa;
    text-decoration: none;
    font-size: 16px;
    margin-bottom: 25px;
}

.back:hover {
    color: #a78bfa;
}

.card {
    background: rgba(30, 41, 59, 0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: #fff;
    font-size: 17px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #60a5fa;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    margin-bottom: 20px;
}

button {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 10px;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.92;
}

.result {
    margin-top: 25px;
    padding: 22px;
    border-radius: 15px;
    background: #0f172a;
    display: none;
}

.result-main {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 18px;
    word-break: break-word;
}

.info {
    display: grid;
    gap: 10px;
    color: #cbd5e1;
    font-size: 14px;
}

.info div {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 1px solid #334155;
    padding-bottom: 8px;
}

.info div:last-child {
    border-bottom: none;
}

.positive {
    color: #4ade80;
}

.negative {
    color: #f87171;
}

.status {
    margin-top: 15px;
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
}

.error {
    color: #f87171;
}

@media (max-width: 500px) {
    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .card {
        padding: 22px;
    }

    h1 {
        font-size: 26px;
    }

    .result-main {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Все калькуляторы</a>

<div class="card">

<h1>🪙 Конвертер криптовалют</h1>

<div class="subtitle">
Актуальные курсы криптовалют
</div>

<div class="field">
<label for="amount">Количество</label>

<input
    type="number"
    id="amount"
    value="1"
    min="0"
    step="any"
>
</div>

<div class="row">

<div class="field">
<label for="from">Из</label>

<select id="from">
    <option value="btc-bitcoin">Bitcoin (BTC)</option>
    <option value="eth-ethereum">Ethereum (ETH)</option>
    <option value="ltc-litecoin">Litecoin (LTC)</option>
    <option value="bnb-binance-coin">BNB</option>
    <option value="sol-solana">Solana (SOL)</option>
    <option value="xrp-xrp">XRP</option>
    <option value="doge-dogecoin">Dogecoin (DOGE)</option>
    <option value="ada-cardano">Cardano (ADA)</option>
    <option value="trx-tron">TRON (TRX)</option>
    <option value="ton-toncoin">Toncoin (TON)</option>
    <option value="avax-avalanche">Avalanche (AVAX)</option>
    <option value="dot-polkadot">Polkadot (DOT)</option>
    <option value="link-chainlink">Chainlink (LINK)</option>
    <option value="bch-bitcoin-cash">Bitcoin Cash (BCH)</option>
    <option value="xlm-stellar">Stellar (XLM)</option>
    <option value="shib-shiba-inu">Shiba Inu (SHIB)</option>
    <option value="uni-uniswap">Uniswap (UNI)</option>
    <option value="atom-cosmos">Cosmos (ATOM)</option>
    <option value="etc-ethereum-classic">Ethereum Classic (ETC)</option>
    <option value="near-near-protocol">NEAR Protocol (NEAR)</option>
    <option value="apt-aptos">Aptos (APT)</option>
    <option value="fil-filecoin">Filecoin (FIL)</option>
    <option value="algo-algorand">Algorand (ALGO)</option>
    <option value="icp-internet-computer">Internet Computer (ICP)</option>
    <option value="sui-sui">Sui (SUI)</option>
</select>
</div>

<div class="field">
<label for="to">В</label>

<select id="to">
    <option value="USD">Доллар США (USD)</option>
    <option value="EUR">Евро (EUR)</option>
    <option value="RUB">Российский рубль (RUB)</option>
    <option value="btc-bitcoin">Bitcoin (BTC)</option>
    <option value="eth-ethereum">Ethereum (ETH)</option>
    <option value="ltc-litecoin">Litecoin (LTC)</option>
    <option value="bnb-binance-coin">BNB</option>
    <option value="sol-solana">Solana (SOL)</option>
    <option value="xrp-xrp">XRP</option>
    <option value="doge-dogecoin">Dogecoin (DOGE)</option>
    <option value="ada-cardano">Cardano (ADA)</option>
    <option value="trx-tron">TRON (TRX)</option>
    <option value="ton-toncoin">Toncoin (TON)</option>
    <option value="avax-avalanche">Avalanche (AVAX)</option>
    <option value="dot-polkadot">Polkadot (DOT)</option>
    <option value="link-chainlink">Chainlink (LINK)</option>
    <option value="bch-bitcoin-cash">Bitcoin Cash (BCH)</option>
    <option value="xlm-stellar">Stellar (XLM)</option>
    <option value="shib-shiba-inu">Shiba Inu (SHIB)</option>
    <option value="uni-uniswap">Uniswap (UNI)</option>
    <option value="atom-cosmos">Cosmos (ATOM)</option>
    <option value="etc-ethereum-classic">Ethereum Classic (ETC)</option>
    <option value="near-near-protocol">NEAR Protocol (NEAR)</option>
    <option value="apt-aptos">Aptos (APT)</option>
    <option value="fil-filecoin">Filecoin (FIL)</option>
    <option value="algo-algorand">Algorand (ALGO)</option>
    <option value="icp-internet-computer">Internet Computer (ICP)</option>
    <option value="sui-sui">Sui (SUI)</option>
</select>
</div>

</div>

<button onclick="convertCrypto()">
Конвертировать
</button>

<div class="result" id="result">

<div class="result-main" id="resultMain"></div>

<div class="info">

<div>
<span>Курс</span>
<strong id="rate">—</strong>
</div>

<div>
<span>Обратный курс</span>
<strong id="reverseRate">—</strong>
</div>

<div>
<span>Изменение за 24 часа</span>
<strong id="change">—</strong>
</div>

<div>
<span>Обновлено</span>
<strong id="updated">—</strong>
</div>

</div>

<div class="status" id="status"></div>

</div>

</div>
</div>

<script>

const API =
"https://api.coinpaprika.com/v1/tickers/";

const cryptoNames = {

    "btc-bitcoin": "BTC",
    "eth-ethereum": "ETH",
    "ltc-litecoin": "LTC",
    "bnb-binance-coin": "BNB",
    "sol-solana": "SOL",
    "xrp-xrp": "XRP",
    "doge-dogecoin": "DOGE",
    "ada-cardano": "ADA",
    "trx-tron": "TRX",
    "ton-toncoin": "TON",

    "avax-avalanche": "AVAX",
    "dot-polkadot": "DOT",
    "link-chainlink": "LINK",
    "bch-bitcoin-cash": "BCH",
    "xlm-stellar": "XLM",
    "shib-shiba-inu": "SHIB",
    "uni-uniswap": "UNI",
    "atom-cosmos": "ATOM",
    "etc-ethereum-classic": "ETC",
    "near-near-protocol": "NEAR",
    "apt-aptos": "APT",
    "fil-filecoin": "FIL",
    "algo-algorand": "ALGO",
    "icp-internet-computer": "ICP",
    "sui-sui": "SUI"
};

const fiatNames = {
    USD: "USD",
    EUR: "EUR",
    RUB: "RUB"
};

function getName(value) {

    return cryptoNames[value] ||
           fiatNames[value] ||
           value;
}

function formatNumber(value) {

    if (!Number.isFinite(value)) {
        return "—";
    }

    if (Math.abs(value) >= 1000) {

        return value.toLocaleString("ru-RU", {
            maximumFractionDigits: 2
        });
    }

    if (Math.abs(value) >= 1) {

        return value.toLocaleString("ru-RU", {
            maximumFractionDigits: 6
        });
    }

    return value.toLocaleString("ru-RU", {
        maximumFractionDigits: 10
    });
}

async function getTicker(id, quotes) {

    const response = await fetch(
        `${API}${id}?quotes=${quotes}`
    );

    if (!response.ok) {

        throw new Error(
            `Ошибка API: ${response.status}`
        );
    }

    const data =
        await response.json();

    if (!data || !data.quotes) {

        throw new Error(
            "API не вернул данные"
        );
    }

    return data;
}

async function convertCrypto() {

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const from =
        document.getElementById("from").value;

    const to =
        document.getElementById("to").value;

    const result =
        document.getElementById("result");

    const resultMain =
        document.getElementById("resultMain");

    const status =
        document.getElementById("status");

    if (!amount || amount <= 0) {

        result.style.display = "block";

        resultMain.textContent =
            "Введите количество";

        return;
    }

    result.style.display = "block";

    resultMain.textContent =
        "Загрузка...";

    status.textContent = "";

    try {

        let rate;
        let change24;
        let updated;

        /*
         * Криптовалюта → фиат
         */

        if (
            cryptoNames[from] &&
            fiatNames[to]
        ) {

            const ticker =
                await getTicker(from, to);

            const quote =
                ticker.quotes[to];

            if (!quote) {
                throw new Error(
                    `Валюта ${to} недоступна`
                );
            }

            rate =
                quote.price;

            change24 =
                quote.percent_change_24h;

            updated =
                ticker.last_updated;
        }

        /*
         * Криптовалюта → криптовалюта
         */

        else if (
            cryptoNames[from] &&
            cryptoNames[to]
        ) {

            const first =
                await getTicker(from, "USD");

            const second =
                await getTicker(to, "USD");

            const firstUSD =
                first.quotes.USD.price;

            const secondUSD =
                second.quotes.USD.price;

            rate =
                firstUSD / secondUSD;

            change24 =
                first.quotes.USD.percent_change_24h;

            updated =
                first.last_updated;
        }

        else {

            throw new Error(
                "Выберите криптовалюту в первом поле"
            );
        }

        const converted =
            amount * rate;

        const reverse =
            1 / rate;

        const fromName =
            getName(from);

        const toName =
            getName(to);

        resultMain.textContent =
            `${formatNumber(amount)} ${fromName} = ` +
            `${formatNumber(converted)} ${toName}`;

        document.getElementById("rate").textContent =
            `1 ${fromName} = ` +
            `${formatNumber(rate)} ${toName}`;

        document.getElementById("reverseRate").textContent =
            `1 ${toName} = ` +
            `${formatNumber(reverse)} ${fromName}`;

        const changeElement =
            document.getElementById("change");

        changeElement.textContent =
            `${change24 >= 0 ? "+" : ""}` +
            `${formatNumber(change24)}%`;

        changeElement.className =
            change24 >= 0
                ? "positive"
                : "negative";

        document.getElementById("updated").textContent =
            new Date(updated).toLocaleString("ru-RU");

        status.textContent =
            "Данные предоставлены CoinPaprika";

    } catch (error) {

        resultMain.textContent =
            "Не удалось получить курс";

        status.innerHTML =
            `<span class="error">${error.message}</span>`;

        document.getElementById("rate").textContent = "—";
        document.getElementById("reverseRate").textContent = "—";
        document.getElementById("change").textContent = "—";
        document.getElementById("updated").textContent = "—";
    }
}

</script>

</body>
</html>
