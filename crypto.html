<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФинРасчёт — конвертер криптовалют</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

.back {
    display: inline-block;
    color: #60a5fa;
    text-decoration: none;
    font-size: 16px;
    margin-bottom: 25px;
}

.back:hover {
    color: #a78bfa;
}

.card {
    background: rgba(30, 41, 59, 0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: #fff;
    font-size: 17px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #60a5fa;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    margin-bottom: 20px;
}

button {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 10px;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.92;
}

.result {
    margin-top: 25px;
    padding: 22px;
    border-radius: 15px;
    background: #0f172a;
    display: none;
}

.result-main {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 18px;
    word-break: break-word;
}

.info {
    display: grid;
    gap: 10px;
    color: #cbd5e1;
    font-size: 14px;
}

.info div {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 1px solid #334155;
    padding-bottom: 8px;
}

.info div:last-child {
    border-bottom: none;
}

.positive {
    color: #4ade80;
}

.negative {
    color: #f87171;
}

.status {
    margin-top: 15px;
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
}

.error {
    color: #f87171;
}

@media (max-width: 500px) {
    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .card {
        padding: 22px;
    }

    h1 {
        font-size: 26px;
    }

    .result-main {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Все калькуляторы</a>

<div class="card">

<h1>🪙 Конвертер криптовалют</h1>

<div class="subtitle">
Актуальные курсы CoinMarketCap
</div>

<div class="field">
<label for="amount">Количество</label>

<input
    type="number"
    id="amount"
    value="1"
    min="0"
    step="any"
>
</div>

<div class="row">

<div class="field">
<label for="from">Из</label>

<select id="from">
    <option value="1">Bitcoin (BTC)</option>
    <option value="1027">Ethereum (ETH)</option>
    <option value="2">Litecoin (LTC)</option>
    <option value="1839">BNB</option>
    <option value="5426">Solana (SOL)</option>
    <option value="52">XRP</option>
    <option value="74">Dogecoin (DOGE)</option>
    <option value="2010">Cardano (ADA)</option>
    <option value="1958">TRON (TRX)</option>
    <option value="11419">Toncoin (TON)</option>
</select>
</div>

<div class="field">
<label for="to">В</label>

<select id="to">
    <option value="USD">Доллар США (USD)</option>
    <option value="EUR">Евро (EUR)</option>
    <option value="RUB">Российский рубль (RUB)</option>
    <option value="1">Bitcoin (BTC)</option>
    <option value="1027">Ethereum (ETH)</option>
    <option value="1839">BNB</option>
    <option value="2">Litecoin (LTC)</option>
</select>
</div>

</div>

<button onclick="convertCrypto()">
Конвертировать
</button>

<div class="result" id="result">

<div class="result-main" id="resultMain"></div>

<div class="info">

<div>
<span>Курс</span>
<strong id="rate">—</strong>
</div>

<div>
<span>Обратный курс</span>
<strong id="reverseRate">—</strong>
</div>

<div>
<span>Изменение за 24 часа</span>
<strong id="change">—</strong>
</div>

<div>
<span>Обновлено</span>
<strong id="updated">—</strong>
</div>

</div>

<div class="status" id="status"></div>

</div>

</div>
</div>

<script>

const API =
"https://pro-api.coinmarketcap.com/public-api/v1/simple/price";

const cryptoNames = {
    "1": "BTC",
    "1027": "ETH",
    "2": "LTC",
    "1839": "BNB",
    "5426": "SOL",
    "52": "XRP",
    "74": "DOGE",
    "2010": "ADA",
    "1958": "TRX",
    "11419": "TON"
};

const fiatNames = {
    USD: "USD",
    EUR: "EUR",
    RUB: "RUB"
};

async function getPrice(id, currency) {

    const url =
        `${API}?ids=${id}&convert=${currency}`;

    const response = await fetch(url, {
        headers: {
            "Accept": "application/json"
        }
    });

    if (!response.ok) {
        throw new Error(
            `CoinMarketCap: HTTP ${response.status}`
        );
    }

    const json = await response.json();

    if (
        json.status &&
        String(json.status.error_code) !== "0"
    ) {
        throw new Error(
            json.status.error_message ||
            "Ошибка CoinMarketCap"
        );
    }

    if (
        !json.data ||
        !json.data.length ||
        json.data[0].price === undefined
    ) {
        throw new Error(
            "CoinMarketCap не вернул цену"
        );
    }

    return json.data[0].price;
}

function getName(value) {

    if (cryptoNames[value]) {
        return cryptoNames[value];
    }

    return fiatNames[value] || value;
}

function formatNumber(value) {

    if (!Number.isFinite(value)) {
        return "—";
    }

    if (Math.abs(value) >= 1000) {
        return value.toLocaleString("ru-RU", {
            maximumFractionDigits: 2
        });
    }

    if (Math.abs(value) >= 1) {
        return value.toLocaleString("ru-RU", {
            maximumFractionDigits: 6
        });
    }

    return value.toLocaleString("ru-RU", {
        maximumFractionDigits: 10
    });
}

async function convertCrypto() {

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const from =
        document.getElementById("from").value;

    const to =
        document.getElementById("to").value;

    const result =
        document.getElementById("result");

    const resultMain =
        document.getElementById("resultMain");

    const status =
        document.getElementById("status");

    if (!amount || amount <= 0) {

        result.style.display = "block";

        resultMain.textContent =
            "Введите количество";

        status.textContent = "";

        return;
    }

    result.style.display = "block";

    resultMain.textContent =
        "Загрузка...";

    status.textContent = "";

    try {

        let rate;

        /*
         * Если обе стороны — криптовалюты.
         */
        if (
            cryptoNames[from] &&
            cryptoNames[to]
        ) {

            const fromUSD =
                await getPrice(from, "USD");

            const toUSD =
                await getPrice(to, "USD");

            rate =
                fromUSD / toUSD;
        }

        /*
         * Криптовалюта → фиат.
         */
        else if (
            cryptoNames[from] &&
            fiatNames[to]
        ) {

            rate =
                await getPrice(from, to);
        }

        /*
         * Фиат → криптовалюта.
         */
        else if (
            fiatNames[from] &&
            cryptoNames[to]
        ) {

            const cryptoPrice =
                await getPrice(to, from);

            rate =
                1 / cryptoPrice;
        }

        /*
         * Фиат → фиат.
         * Этот режим пока не нужен.
         */
        else {

            throw new Error(
                "Конвертация между фиатными валютами здесь не поддерживается"
            );
        }

        const converted =
            amount * rate;

        const reverse =
            1 / rate;

        const fromName =
            getName(from);

        const toName =
            getName(to);

        resultMain.textContent =
            `${formatNumber(amount)} ${fromName} = ` +
            `${formatNumber(converted)} ${toName}`;

        document.getElementById("rate").textContent =
            `1 ${fromName} = ` +
            `${formatNumber(rate)} ${toName}`;

        document.getElementById("reverseRate").textContent =
            `1 ${toName} = ` +
            `${formatNumber(reverse)} ${fromName}`;

        /*
         * Simple Price специально отдаёт только цену,
         * поэтому изменение за 24 часа здесь пока
         * не выводим как выдуманное значение.
         */

        document.getElementById("change").textContent =
            "Доступно в расширенном запросе";

        document.getElementById("change").className = "";

        document.getElementById("updated").textContent =
            new Date().toLocaleString("ru-RU");

        status.textContent =
            "Данные CoinMarketCap";

    } catch (error) {

        resultMain.textContent =
            "Не удалось получить курс";

        status.innerHTML =
            `<span class="error">${error.message}</span>`;

        document.getElementById("rate").textContent = "—";
        document.getElementById("reverseRate").textContent = "—";
        document.getElementById("change").textContent = "—";
        document.getElementById("updated").textContent = "—";
    }
}

</script>

</body>
</html>
