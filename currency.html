```html
<!DOCTYPE html>

<style>

<body>

<div class="container">

<a href="index.html" class="back">
    ← Все калькуляторы
</a>

<div class="header">

    <h1>
        <span>Конвертер валют</span>
    </h1>

    <p>
        Конвертация по актуальному доступному курсу
    </p>

</div>


<div class="card">

    <label for="amount">
        Сумма
    </label>

    <input
        type="number"
        id="amount"
        value="1000"
        min="0"
        step="any"
    >


    <label for="fromSearch">
        Из валюты
    </label>

    <input
        type="text"
        id="fromSearch"
        class="search"
        placeholder="Поиск: RUB, рубль, доллар..."
    >

    <select id="from">
        <option>Загрузка валют...</option>
    </select>


    <button
        class="swap"
        onclick="swapCurrencies()"
    >
        ↔ Поменять валюты местами
    </button>


    <label for="toSearch">
        В валюту
    </label>

    <input
        type="text"
        id="toSearch"
        class="search"
        placeholder="Поиск: USD, евро, юань..."
    >

    <select id="to">
        <option>Загрузка валют...</option>
    </select>


    <button onclick="convert()">
        💱 Конвертировать
    </button>


    <div class="error" id="error"></div>

</div>


<div class="card">

    <div class="result">

        <small id="resultLabel">
            Результат
        </small>

        <strong id="result">
            —
        </strong>

    </div>

    <div class="rate-info" id="rateInfo">
        Загружаем список валют...
    </div>

</div>

</div>


<script>

const CURRENCIES_API =
    'https://api.frankfurter.dev/v2/currencies';

const RATE_API =
    'https://api.frankfurter.dev/v2/rate/';

let currencies = [];


/*
 * Основные валюты показываем первыми.
 */
const popular = [
    'RUB',
    'USD',
    'EUR',
    'CNY',
    'GBP',
    'CHF',
    'JPY',
    'KZT',
    'BYN',
    'UZS',
    'TRY',
    'AED',
    'INR',
    'CAD',
    'AUD',
    'PLN'
];


function formatNumber(value) {

    return Number(value).toLocaleString(
        'ru-RU',
        {
            maximumFractionDigits: 6
        }
    );

}


function showError(message) {

    const error =
        document.getElementById('error');

    error.textContent = message;
    error.style.display = 'block';

}


function hideError() {

    document.getElementById('error')
        .style.display = 'none';

}


function currencyLabel(currency) {

    return currency.iso_code +
        ' — ' +
        currency.name +
        (currency.symbol
            ? ' (' + currency.symbol + ')'
            : '');

}


function renderSelect(selectId, searchText = '') {

    const select =
        document.getElementById(selectId);

    const query =
        searchText.trim().toLowerCase();


    let filtered =
        currencies.filter(currency => {

            const text =
                (
                    currency.iso_code +
                    ' ' +
                    currency.name +
                    ' ' +
                    (currency.symbol || '')
                ).toLowerCase();

            return text.includes(query);
        });


    const popularItems =
        popular
            .map(code =>
                filtered.find(
                    currency =>
                        currency.iso_code === code
                )
            )
            .filter(Boolean);


    const otherItems =
        filtered.filter(currency =>
            !popular.includes(currency.iso_code)
        );


    const sorted =
        [...popularItems, ...otherItems];


    select.innerHTML = '';


    if (sorted.length === 0) {

        const option =
            document.createElement('option');

        option.textContent =
            'Ничего не найдено';

        select.appendChild(option);

        return;
    }


    sorted.forEach(currency => {

        const option =
            document.createElement('option');

        option.value =
            currency.iso_code;

        option.textContent =
            currencyLabel(currency);

        select.appendChild(option);

    });

}


async function loadCurrencies() {

    try {

        const response =
            await fetch(CURRENCIES_API);


        if (!response.ok) {
            throw new Error('Ошибка загрузки валют');
        }


        const data =
            await response.json();


        currencies =
            Object.values(data);


        renderSelect('from');

        renderSelect('to');


        document.getElementById('from').value =
            'RUB';

        document.getElementById('to').value =
            'USD';


        document.getElementById('rateInfo').textContent =
            'Выберите валюты и нажмите «Конвертировать».';


    } catch (error) {

        console.error(error);

        showError(
            'Не удалось загрузить список валют.'
        );

        document.getElementById('rateInfo').textContent =
            'Ошибка загрузки валют.';

    }

}


async function convert() {

    hideError();


    const amount =
        Number(
            document.getElementById('amount').value
        );


    const from =
        document.getElementById('from').value;


    const to =
        document.getElementById('to').value;


    if (!Number.isFinite(amount) || amount < 0) {

        showError(
            'Введите корректную сумму.'
        );

        return;
    }


    if (!from || !to) {

        showError(
            'Выберите обе валюты.'
        );

        return;
    }


    if (from === to) {

        document.getElementById('resultLabel').textContent =
            formatNumber(amount) +
            ' ' +
            from +
            ' =';


        document.getElementById('result').textContent =
            formatNumber(amount) +
            ' ' +
            to;


        document.getElementById('rateInfo').innerHTML =
            '1 ' +
            from +
            ' = 1 ' +
            to;

        return;
    }


    document.getElementById('result').textContent =
        'Загрузка...';


    document.getElementById('rateInfo').textContent =
        'Получаем курс...';


    try {

        let url =
            RATE_API +
            from +
            '/' +
            to;


        /*
         * Для RUB используем официальный
         * источник ЦБ РФ через Frankfurter.
         */

        if (from === 'RUB' || to === 'RUB') {

            url += '?providers=CBR';

        }


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                'Ошибка получения курса'
            );

        }


        const data =
            await response.json();


        const rate =
            Number(data.rate);


        const converted =
            amount * rate;


        document.getElementById('resultLabel').textContent =
            formatNumber(amount) +
            ' ' +
            from +
            ' =';


        document.getElementById('result').textContent =
            formatNumber(converted) +
            ' ' +
            to;


        document.getElementById('rateInfo').innerHTML =

            '1 ' +
            from +
            ' = <strong>' +
            formatNumber(rate) +
            ' ' +
            to +
            '</strong><br>' +

            'Дата курса: ' +
            (data.date || 'последний доступный');


    } catch (error) {

        console.error(error);

        document.getElementById('result').textContent =
            '—';

        document.getElementById('rateInfo').textContent =
            'Не удалось получить курс.';

        showError(
            'Не удалось получить курс валют. Попробуйте ещё раз.'
        );

    }

}


function swapCurrencies() {

    const from =
        document.getElementById('from');

    const to =
        document.getElementById('to');


    const oldFrom =
        from.value;


    from.value =
        to.value;


    to.value =
        oldFrom;


    document.getElementById('fromSearch').value =
        '';


    document.getElementById('toSearch').value =
        '';


    convert();

}


document
    .getElementById('fromSearch')
    .addEventListener(
        'input',
        function() {

            const current =
                document.getElementById('from').value;

            renderSelect(
                'from',
                this.value
            );

            if (
                currencies.some(
                    currency =>
                        currency.iso_code === current
                )
            ) {

                const option =
                    [...document.getElementById('from').options]
                    .find(
                        option =>
                            option.value === current
                    );

                if (option) {
                    option.selected = true;
                }

            }

        }
    );


document
    .getElementById('toSearch')
    .addEventListener(
        'input',
        function() {

            const current =
                document.getElementById('to').value;

            renderSelect(
                'to',
                this.value
            );

            if (
                currencies.some(
                    currency =>
                        currency.iso_code === current
                )
            ) {

                const option =
                    [...document.getElementById('to').options]
                    .find(
                        option =>
                            option.value === current
                    );

                if (option) {
                    option.selected = true;
                }

            }

        }
    );


document
    .getElementById('amount')
    .addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Enter') {
                convert();
            }

        }
    );


loadCurrencies();

</script>

</body>
</html>
