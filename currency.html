<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ФинРасчёт — конвертер валют</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;

    background:
        radial-gradient(circle at top left, #243b80 0, transparent 35%),
        radial-gradient(circle at bottom right, #4b1f72 0, transparent 35%),
        #0b1020;
}

    margin: 0 auto 20px;
    max-width: 1000px;
    padding: 0 5%;

    text-decoration: none;
    font-weight: bold;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: #8f7cff;
}

.container {
    width: min(900px, 94%);
    margin: auto;
    padding: 35px 0 50px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0 0 12px;
    font-size: 42px;
}

.header h1 span {
    background: linear-gradient(90deg, #4facfe, #8f7cff);

    -webkit-text-fill-color: transparent;
}

}

.card {
    background: rgba(20,28,52,.9);
    border: 1px solid rgba(255,255,255,.09);

select {

</head>

<body>

<a href="index.html" class="back-link">
    ← Все калькуляторы
</a>

<div class="container">

    <div class="header">

        <h1>
            <span>Конвертер валют</span>
        </h1>

        <p>
            Переводите суммы между основными мировыми валютами
        </p>

    </div>


    <div class="card">

        <label for="amount">
            Сумма
        </label>

        <input
            type="number"
            id="amount"
            value="1000"
            min="0"
            step="any"
        >


        <label for="from">
            Из валюты
        </label>

        <select id="from">

            <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
            <option value="USD">🇺🇸 Доллар США (USD)</option>
            <option value="EUR">🇪🇺 Евро (EUR)</option>
            <option value="CNY">🇨🇳 Китайский юань (CNY)</option>
            <option value="GBP">🇬🇧 Фунт стерлингов (GBP)</option>
            <option value="CHF">🇨🇭 Швейцарский франк (CHF)</option>
            <option value="JPY">🇯🇵 Японская иена (JPY)</option>

        </select>


        <button
            class="swap"
            onclick="swapCurrencies()"
        >
            ↔ Поменять валюты местами
        </button>


        <label for="to">
            В валюту
        </label>

        <select id="to">

            <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
            <option value="USD" selected>🇺🇸 Доллар США (USD)</option>
            <option value="EUR">🇪🇺 Евро (EUR)</option>
            <option value="CNY">🇨🇳 Китайский юань (CNY)</option>
            <option value="GBP">🇬🇧 Фунт стерлингов (GBP)</option>
            <option value="CHF">🇨🇭 Швейцарский франк (CHF)</option>
            <option value="JPY">🇯🇵 Японская иена (JPY)</option>

        </select>


        <button onclick="convert()">
            💱 Конвертировать
        </button>


        <div class="error" id="error"></div>

    </div>


    <div class="card">

        <div class="result">

            <small id="resultLabel">
                Результат
            </small>

            <strong id="result">
                —
            </strong>

        </div>


        <div class="rate-info" id="rateInfo">
            Курс будет загружен после расчёта
        </div>

    </div>

</div>


<script>

const API =
    'https://api.frankfurter.dev/v2/rate/';


const currencyNames = {

    RUB: 'Российский рубль',
    USD: 'Доллар США',
    EUR: 'Евро',
    CNY: 'Китайский юань',
    GBP: 'Фунт стерлингов',
    CHF: 'Швейцарский франк',
    JPY: 'Японская иена'

};


function formatNumber(value) {

    return Number(value).toLocaleString(
        'ru-RU',
        {
            maximumFractionDigits: 4
        }
    );

}


function showError(message) {

    const error =
        document.getElementById('error');

    error.textContent = message;
    error.style.display = 'block';

}


function hideError() {

    document.getElementById('error')
        .style.display = 'none';

}


async function convert() {

    hideError();

    const amount =
        Number(
            document.getElementById('amount').value
        );

    const from =
        document.getElementById('from').value;

    const to =
        document.getElementById('to').value;


    if (!Number.isFinite(amount) || amount < 0) {

        showError(
            'Введите корректную сумму.'
        );

        return;
    }


    if (from === to) {

        document.getElementById('result').textContent =
            formatNumber(amount) + ' ' + to;

        document.getElementById('resultLabel').textContent =
            currencyNames[from];

        document.getElementById('rateInfo').textContent =
            '1 ' + from + ' = 1 ' + to;

        return;
    }


    document.getElementById('result').textContent =
        'Загрузка...';

    document.getElementById('rateInfo').textContent =
        'Получаем актуальный курс...';


    try {

        let url =
            API + from + '/' + to;


        /*
         * Для пар с RUB используем данные
         * Центрального банка России.
         */

        if (from === 'RUB' || to === 'RUB') {

            url += '?providers=CBR';

        }


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                'Ошибка получения курса'
            );

        }


        const data =
            await response.json();


        const rate =
            Number(data.rate);


        const converted =
            amount * rate;


        document.getElementById('result').textContent =
            formatNumber(converted) + ' ' + to;


        document.getElementById('resultLabel').textContent =
            formatNumber(amount) + ' ' + from +
            ' =';


        document.getElementById('rateInfo').innerHTML =

            '1 ' + from +
            ' = <strong>' +
            formatNumber(rate) +
            ' ' + to +
            '</strong><br>' +

            'Курс: ' +
            (data.date || 'последний доступный');


    } catch (error) {

        console.error(error);

        document.getElementById('result').textContent =
            '—';

        document.getElementById('rateInfo').textContent =
            'Не удалось получить курс валют.';

        showError(
            'Не удалось загрузить актуальный курс. Проверьте подключение к интернету и попробуйте ещё раз.'
        );

    }

}


function swapCurrencies() {

    const from =
        document.getElementById('from');

    const to =
        document.getElementById('to');


    const oldFrom =
        from.value;

    from.value =
        to.value;

    to.value =
        oldFrom;


    convert();

}


document
    .getElementById('amount')
    .addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Enter') {

                convert();

            }

        }
    );


convert();

</script>

</body>
</html>
