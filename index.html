<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор вклада</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
        }

        input:focus {
            outline: none;
            border-color: #1677ff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1677ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #005fe6;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .result-box {
            background: #f3f7ff;
            border-radius: 12px;
            padding: 15px;
        }

        .result-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .result-value {
            font-size: 21px;
            font-weight: bold;
        }

        .chart {
            margin-top: 20px;
            height: 260px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            padding: 15px 5px 0;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }

        .bar {
            min-width: 12px;
            background: #1677ff;
            border-radius: 4px 4px 0 0;
            position: relative;
        }

        .bar:hover {
            opacity: 0.8;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 450px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: right;
        }

        th:first-child,
        td:first-child {
            text-align: center;
        }

        th {
            background: #f5f5f5;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 18px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>Калькулятор вклада</h1>
        <div class="subtitle">
            Рассчитайте доход с ежемесячной капитализацией
        </div>

        <label for="initial">Начальная сумма, ₽</label>
        <input type="number" id="initial" value="550000" min="0">

        <label for="rate">Процентная ставка, % годовых</label>
        <input type="number" id="rate" value="13.2" min="0" step="0.1">

        <label for="months">Срок, месяцев</label>
        <input type="number" id="months" value="5" min="1">

        <label for="addition">Пополнение каждый месяц, ₽</label>
        <input type="number" id="addition" value="0" min="0">

        <button onclick="calculate()">Рассчитать</button>
    </div>

    <div class="card">

        <h2>Результат</h2>

        <div class="result-grid">

            <div class="result-box">
                <div class="result-title">Итоговая сумма</div>
                <div class="result-value" id="finalAmount">—</div>
            </div>

            <div class="result-box">
                <div class="result-title">Доход</div>
                <div class="result-value" id="profit">—</div>
            </div>

            <div class="result-box">
                <div class="result-title">Внесено своих денег</div>
                <div class="result-value" id="invested">—</div>
            </div>

            <div class="result-box">
                <div class="result-title">Заработано в %</div>
                <div class="result-value" id="profitPercent">—</div>
            </div>

        </div>

        <h2>Рост вклада</h2>
        <div class="chart" id="chart"></div>

    </div>

    <div class="card">

        <h2>Расчёт по месяцам</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Месяц</th>
                        <th>Пополнение</th>
                        <th>Проценты</th>
                        <th>Баланс</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

</div>

<script>

function formatMoney(number) {
    return Math.round(number).toLocaleString("ru-RU") + " ₽";
}

function calculate() {

    let initial = Number(document.getElementById("initial").value);
    let rate = Number(document.getElementById("rate").value);
    let months = Number(document.getElementById("months").value);
    let addition = Number(document.getElementById("addition").value);

    if (initial < 0 || rate < 0 || months <= 0 || addition < 0) {
        alert("Проверьте введённые данные.");
        return;
    }

    let monthlyRate = rate / 100 / 12;
    let balance = initial;

    let totalInvested = initial;
    let rows = [];

    for (let month = 1; month <= months; month++) {

        balance += addition;
        totalInvested += addition;

        let interest = balance * monthlyRate;
        balance += interest;

        rows.push({
            month: month,
            addition: addition,
            interest: interest,
            balance: balance
        });
    }

    let profit = balance - totalInvested;
    let profitPercent = totalInvested > 0
        ? (profit / totalInvested) * 100
        : 0;

    document.getElementById("finalAmount").textContent =
        formatMoney(balance);

    document.getElementById("profit").textContent =
        formatMoney(profit);

    document.getElementById("invested").textContent =
        formatMoney(totalInvested);

    document.getElementById("profitPercent").textContent =
        profitPercent.toFixed(2).replace(".", ",") + "%";

    createTable(rows);
    createChart(rows);
}

function createTable(rows) {

    let tableBody = document.getElementById("tableBody");

    tableBody.innerHTML = "";

    rows.forEach(function(row) {

        let tr = document.createElement("tr");

        tr.innerHTML =
            "<td>" + row.month + "</td>" +
            "<td>" + formatMoney(row.addition) + "</td>" +
            "<td>" + formatMoney(row.interest) + "</td>" +
            "<td>" + formatMoney(row.balance) + "</td>";

        tableBody.appendChild(tr);
    });
}

function createChart(rows) {

    let chart = document.getElementById("chart");

    chart.innerHTML = "";

    if (rows.length === 0) {
        return;
    }

    let maxBalance = Math.max(...rows.map(row => row.balance));

    rows.forEach(function(row) {

        let bar = document.createElement("div");

        bar.className = "bar";

        let height = (row.balance / maxBalance) * 230;

        bar.style.height = height + "px";

        bar.title =
            "Месяц " + row.month +
            ": " + formatMoney(row.balance);

        chart.appendChild(bar);
    });
}

calculate();

</script>

</body>
</html>
