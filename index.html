<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор вклада</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #005fe6;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f6ff;
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Калькулятор вклада</h1>

    <label>Начальная сумма, ₽</label>
    <input type="number" id="initial" value="100000">

    <label>Процентная ставка, % годовых</label>
    <input type="number" id="rate" value="10">

    <label>Срок, месяцев</label>
    <input type="number" id="months" value="12">

    <label>Пополнение каждый месяц, ₽</label>
    <input type="number" id="addition" value="0">

    <button onclick="calculate()">Рассчитать</button>

    <div class="result" id="result">
        Введите данные и нажмите «Рассчитать»
    </div>

</div>

<script>
function calculate() {

    let initial = Number(document.getElementById("initial").value);
    let rate = Number(document.getElementById("rate").value);
    let months = Number(document.getElementById("months").value);
    let addition = Number(document.getElementById("addition").value);

    let monthlyRate = rate / 100 / 12;
    let balance = initial;

    for (let i = 0; i < months; i++) {

        balance = balance + addition;

        balance = balance * (1 + monthlyRate);
    }

    let invested = initial + addition * months;
    let profit = balance - invested;

    document.getElementById("result").innerHTML =
        "<b>Итоговая сумма:</b> " + formatMoney(balance) + " ₽<br>" +
        "<b>Внесено своих денег:</b> " + formatMoney(invested) + " ₽<br>" +
        "<b>Доход:</b> " + formatMoney(profit) + " ₽";
}

function formatMoney(number) {
    return Math.round(number).toLocaleString("ru-RU");
}
</script>

</body>
</html>
